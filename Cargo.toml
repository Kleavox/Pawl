[workspace]
members = ["crates/cli", "crates/crypto", "crates/oidc", "crates/registry"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aead-stream = { version = "0.6", features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
argon2 = "0.5"
base64 = "0.22"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.100"
wasm-bindgen-test = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
