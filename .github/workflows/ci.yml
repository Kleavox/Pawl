name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.filter.outputs.javascript }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            javascript:
              - "apps/**"
              - "worker/**"
              - "packages/**"
              - "crates/**"
              - "tooling/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.base.json"
              - "turbo.json"
              - ".github/workflows/ci.yml"

  javascript:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ github.ref_name }}-
            turbo-${{ github.job }}-

      - run: rustup target add wasm32-unknown-unknown

      - name: Cache wasm-pack binary
        id: cache-wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}

      - run: cargo install wasm-pack --locked --version 0.15.0
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/.wasm-pack
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Warm wasm-bindgen-cli cache
        run: wasm-pack build --target web --out-dir /tmp/wasm-pack-warmup --release crates/crypto --locked

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ github.ref_name }}-
            turbo-${{ github.job }}-

      - run: rustup target add wasm32-unknown-unknown

      - name: Cache wasm-pack binary
        id: cache-wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}

      - run: cargo install wasm-pack --locked --version 0.15.0
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/.wasm-pack
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Warm wasm-bindgen-cli cache
        run: wasm-pack build --target web --out-dir /tmp/wasm-pack-warmup --release crates/crypto --locked

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @pawl/e2e exec playwright install --with-deps chromium

      - run: pnpm e2e

  validate:
    name: validate
    if: always()
    needs:
      - changes
      - javascript
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required checks passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$JAVASCRIPT_RESULT" = "success" || test "$JAVASCRIPT_RESULT" = "skipped"
          test "$E2E_RESULT" = "success" || test "$E2E_RESULT" = "skipped"

  deploy:
    name: deploy
    needs:
      - changes
      - validate
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.javascript == 'true'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      ESTATE_MANIFEST: ${{ vars.ESTATE_MANIFEST }}
    steps:
      - name: Check the production settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ROOT_DOMAIN ADMIN_EMAIL RESEND_API_KEY TURNSTILE_SECRET_KEY TURNSTILE_SITE_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$GITHUB_CLIENT_ID" ]; then missing="$missing OAUTH_GITHUB_CLIENT_ID"; fi
          if [ -z "$GITHUB_CLIENT_SECRET" ]; then missing="$missing OAUTH_GITHUB_CLIENT_SECRET"; fi
          if [ -n "$missing" ]; then
            echo "Missing from GitHub (Settings → Secrets and variables → Actions):$missing" >&2
            exit 1
          fi
          root="$(printf '%s' "$ROOT_DOMAIN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' | sed 's/\.$//')"
          {
            echo "ROOT_DOMAIN=$root"
            echo "VITE_ROOT_ORIGIN=https://$root"
            echo "VITE_PASS_ORIGIN=https://paw.$root"
            echo "PUBLIC_ROOT_ORIGIN=https://$root"
            echo "VITE_TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: rustup target add wasm32-unknown-unknown

      - name: Cache wasm-pack binary
        id: cache-wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}

      - run: cargo install wasm-pack --locked --version 0.15.0
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/.wasm-pack
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Build the apps and the Worker
        run: pnpm build

      - name: Provision, migrate and deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: pnpm pawl deploy

      - name: Smoke test
        env:
          HEALTH_ATTEMPTS: "8"
          HEALTH_DELAY_MS: "15000"
        run: pnpm health:check
